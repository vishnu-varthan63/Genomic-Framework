# augmentation_config.yaml
# =============================================================
# Master configuration for the Genomic Data Augmentation Pipeline
# Project: Genomic Framework - Poultry Disease Classification
# =============================================================

# ---------------------------------------------------------------
# DATASET PATHS
# ---------------------------------------------------------------
paths:
  dataset_root:      "dataset"
  raw_dir:           "dataset/raw"
  healthy_dir:       "dataset/healthy"
  output_root:       "dataset_augmented"
  log_file:          "augmentation_log.log"
  stats_file:        "augmentation_stats.json"
  report_file:       "validation_report.html"
  distribution_csv:  "class_distribution_before_after.csv"

# ---------------------------------------------------------------
# CLASS DEFINITIONS
# ---------------------------------------------------------------
classes:
  Benign:
    label: 0
    sources: ["healthy"]
    priority: "normal"
  Likely_Benign:
    label: 1
    sources: ["H5N2", "H5N3", "H7N2", "H7N3", "H9N2"]
    priority: "CRITICAL"          # Needs 10x augmentation
    target_multiplier: 10
  Likely_Pathogenic:
    label: 2
    sources: ["H5N6", "H5N8", "H7N1", "H7N7", "H10N7", "H10N8"]
    priority: "moderate"
    target_multiplier: 3
  Pathogenic:
    label: 3
    sources: ["H5N1", "H5N9", "H7N9"]
    priority: "moderate"
    target_multiplier: 3

# ---------------------------------------------------------------
# GLOBAL QUALITY CONTROL PARAMETERS
# ---------------------------------------------------------------
quality_control:
  gc_min:               0.38     # 38% minimum GC content
  gc_max:               0.62     # 62% maximum GC content
  min_length:           100      # Minimum valid sequence length (bp)
  max_length:           1500     # Maximum valid sequence length (bp)
  max_n_fraction:       0.05     # Max fraction of ambiguous bases (N)
  max_homopolymer_run:  20       # Max consecutive identical bases
  no_stop_codons:       true     # No stop codons in coding regions
  duplicate_threshold:  0.99     # Similarity threshold for duplicate removal
  min_complexity:       0.10     # Minimum sequence complexity (entropy-based)

# ---------------------------------------------------------------
# TIER 1: BIOLOGICALLY-INFORMED AUGMENTATIONS
# ---------------------------------------------------------------
tier1_biological:
  enabled: true

  # 1.1 Host-Specific Mutation Simulation
  host_adaptation:
    enabled: true
    hosts: ["chicken", "duck", "goose", "quail", "turkey"]
    adaptation_rate:     0.0005   # 0.05% for host adaptation
    random_variation:    0.001    # 0.1% for random variation
    variants_per_host:   3        # 3-5 variants per original per host

  # 1.2 Viral Reassortment Simulation
  reassortment:
    enabled: true
    strain_pairs:
      - ["H5N1",  "H7N9"]
      - ["H5N6",  "H9N2"]
      - ["H5N2",  "H7N2"]
      - ["H5N3",  "H7N3"]
      - ["H7N1",  "H10N7"]
      - ["H5N8",  "H7N7"]
      - ["H10N7", "H10N8"]
    breakpoints: [0.30, 0.50, 0.70]   # 30%, 50%, 70% of sequence length
    variants_per_pair:  5              # 5-10 reassortant variants per pair

  # 1.3 Recombination Events
  recombination:
    enabled: true
    recombination_rate: 0.10     # 10% crossover events
    max_rate:           0.20     # Upper bound: 20%
    n_crossovers_min:   1
    n_crossovers_max:   3
    variants_per_pair:  3

  # 1.4 Codon-Optimized Silent Mutations
  codon_optimization:
    enabled: true
    mutation_rate_min:  0.001    # 0.1% per codon position
    mutation_rate_max:  0.003    # 0.3% per codon position
    target_organism:    "avian"
    variants:           2

# ---------------------------------------------------------------
# TIER 2: IMBALANCE CORRECTION (LIKELY_BENIGN FOCUS)
# ---------------------------------------------------------------
tier2_imbalance:
  enabled: true

  # 2.1 Targeted Oversampling for Likely_Benign
  targeted_oversampling:
    enabled: true
    mutation_rates: [0.0005, 0.001, 0.002, 0.005]  # 0.05%, 0.1%, 0.2%, 0.5%
    variants_per_rate: [10, 10, 5, 5]               # Matches prompt specification

  # 2.2 Synthetic Sequence Generation
  synthetic_generation:
    enabled: true
    n_synthetic:        75       # 50-100 synthetic sequences
    template_class:     "Benign" # Use healthy sequences as templates
    target_class:       "Likely_Benign"
    mutation_rate:      0.003    # Moderate mutation to create "bridge" seqs

  # 2.3 Inter-class Transition Sequences
  transition_sequences:
    enabled: true
    n_transitions:      40       # 30-50 transition sequences total
    from_class:         "Benign"
    to_class:           "Likely_Benign"
    interpolation_steps: 5       # Number of gradual steps

  # 2.4 SMOTE-based Augmentation
  smote:
    enabled: true
    kmer_k:             4        # k-mer size for feature extraction
    n_neighbors:        5        # SMOTE k-NN parameter
    target_ratio:       1.0      # Balance to match largest class

# ---------------------------------------------------------------
# TIER 3: SEQUENCE-LEVEL AUGMENTATIONS
# ---------------------------------------------------------------
tier3_sequence:
  enabled: true

  # 3.1 Reverse Complement
  reverse_complement:
    enabled: true
    apply_fraction: 1.0          # Apply to 100% of sequences

  # 3.2 Sliding Window
  sliding_window:
    enabled: true
    min_source_length: 1500      # Only for sequences >1500bp
    windows:
      - {size: 500,  stride: 250}
      - {size: 750,  stride: 375}
      - {size: 1000, stride: 500}

  # 3.3 Fragment Shuffling
  fragment_shuffling:
    enabled: true
    n_segments_min:     3
    n_segments_max:     5
    apply_fraction:     0.35     # 30-40% of sequences

  # 3.4 Truncation Variations
  truncation:
    enabled: true
    ratios: [0.75, 0.50]        # 75% and 50% of original length

# ---------------------------------------------------------------
# TIER 4: NOISE-BASED AUGMENTATIONS
# ---------------------------------------------------------------
tier4_noise:
  enabled: true

  # 4.1 Sequencing Error Simulation
  sequencing_error:
    enabled: true
    error_rates: [0.001, 0.003, 0.005]  # 0.1%, 0.3%, 0.5%
    apply_fraction: 0.25                 # 20-30% of training data

  # 4.2 GC Content Variation
  gc_variation:
    enabled: true
    shift_range: 0.05            # ±5% GC shift
    apply_fraction: 0.15         # 10-20% of sequences

  # 4.3 Transition/Transversion Bias
  mutation_bias:
    enabled: true
    transition_rate:   0.70      # 2:1 transitions vs transversions
    transversion_rate: 0.30
    overall_rate_min:  0.001
    overall_rate_max:  0.003
    apply_to_affected: true      # Affected sequences only

# ---------------------------------------------------------------
# TIER 5: CONTEXTUAL AUGMENTATIONS
# ---------------------------------------------------------------
tier5_contextual:
  enabled: true

  # 5.1 Phylogenetic-Based
  phylogenetic:
    enabled: true
    n_intermediates:   25        # 20-30 intermediate variants per strain
    branch_length:     0.01      # Expected substitutions per site per branch

  # 5.2 Geographic/Seasonal Variation
  geographic_seasonal:
    enabled: true
    n_variants:        3
    seasonal_rate:     0.002
    geographic_rate:   0.003

# ---------------------------------------------------------------
# SPECIES-SPECIFIC AUGMENTATION PARAMETERS
# ---------------------------------------------------------------
species_profiles:
  chicken:
    adaptation_rate:    0.0005
    immune_escape_rate: 0.001
    mutation_hotspots:  [0.1, 0.3, 0.7, 0.9]  # Positions as fractions of seq
    gc_preference:      0.50

  duck:
    adaptation_rate:    0.0006
    immune_escape_rate: 0.0012
    mutation_hotspots:  [0.15, 0.35, 0.65, 0.85]
    gc_preference:      0.48

  goose:
    adaptation_rate:    0.0004
    immune_escape_rate: 0.0009
    mutation_hotspots:  [0.2, 0.4, 0.6, 0.8]
    gc_preference:      0.49

  quail:
    adaptation_rate:    0.0007
    immune_escape_rate: 0.0015
    mutation_hotspots:  [0.1, 0.25, 0.75, 0.9]
    gc_preference:      0.51

  turkey:
    adaptation_rate:    0.0005
    immune_escape_rate: 0.0011
    mutation_hotspots:  [0.12, 0.38, 0.62, 0.88]
    gc_preference:      0.49

# ---------------------------------------------------------------
# PROCESSING PARAMETERS
# ---------------------------------------------------------------
processing:
  seed:               42
  batch_size:         500        # Sequences per processing batch
  max_workers:        4          # Parallel processing workers
  max_dataset_size:   10         # Maximum 10x original size
  progress_bars:      true
  verbose_logging:    true
  checkpoint_every:   1000       # Save progress every N sequences

# ---------------------------------------------------------------
# AUGMENTED DATASET TARGET SIZES (per class)
# ---------------------------------------------------------------
targets:
  dataset_multiplier: 7          # Aim for 7x overall
  Benign:             3          # 3x (already good at 97.91% F1)
  Likely_Benign:      10         # 10x (CRITICAL - 56.50% F1)
  Likely_Pathogenic:  5          # 5x (Good at 84.14% F1)
  Pathogenic:         7          # 7x (Moderate at 75.96% F1)
