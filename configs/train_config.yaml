# ==============================================================================
# Advanced Training & Optimization Configuration
# Project: Genomic Sequence Classification Framework
# UPDATED: Audit fixes applied (2026-08-06)
# ==============================================================================

# ------------------------------------------------------------------------------
# System & Reproducibility Settings
# ------------------------------------------------------------------------------
system:
  seed: 42
  deterministic: true
  benchmark: false
  device: "auto"              # "auto", "cuda", "mps", "cpu"
  multi_gpu: true            # Use DataParallel if multiple GPUs detected
  num_threads: 6             # Optimized PyTorch CPU worker threads

# ------------------------------------------------------------------------------
# Paths Configuration
# ------------------------------------------------------------------------------
paths:
  dataset_root: "dataset"
  output_dir: "output_advanced"
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  metric_dir: "metrics"
  plot_dir: "plots"
  prediction_dir: "predictions"
  tensorboard_dir: "tensorboard"
  report_dir: "reports"

# ------------------------------------------------------------------------------
# Model & Architecture Hyperparameters
# ------------------------------------------------------------------------------
model:
  seq_len: 512              # FIX: 512 bp context to capture HA cleavage & RBD sites
  vocab_size: 4096          # 4^6 = 4096, matches k_mer_size=6
  k_mer_size: 6             # FIX: corrected from k=3 to k=6 (matches vocab_size=4096)
  hyena_dim: 256
  hidden_dim: 512
  num_classes: 4
  max_mutations: 32
  mutation_dim: 64
  dropout: 0.2

# ------------------------------------------------------------------------------
# Dataset & DataLoader Hyperparameters
# ------------------------------------------------------------------------------
data:
  batch_size: 32
  num_workers: 0
  pin_memory: false
  prefetch_factor: 2
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  class_balance: true
  class_weighting: true
  stratified: true          # Per-class stratified split
  samples_per_epoch: 1280   # Balanced representative samples per epoch across all 30k training sequences
  max_sequences_per_file: null       # Unlimited sequence loading

# ------------------------------------------------------------------------------
# Optimization Settings
# ------------------------------------------------------------------------------
optimization:
  optimizer: "adamw"          # "adamw", "adam", "sgd"
  loss_type: "focal"          # "focal", "cross_entropy"
  focal_gamma: 2.0            # Focusing parameter for class imbalance
  learning_rate: 0.0003
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-08
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  use_amp: false              # Automatic Mixed Precision for CUDA (false for CPU)
  nan_loss_detection: true    # NaN loss skip-step enabled
  gradient_explosion_threshold: 500.0  # Set threshold to 500.0 for 10M+ param global L2 norm

# ------------------------------------------------------------------------------
# Learning Rate Scheduler Settings
# ------------------------------------------------------------------------------
scheduler:
  name: "cosine"              # "cosine", "plateau", "onecycle", "linear"
  warmup_epochs: 1            # Linear warmup for first N epochs
  min_lr: 1.0e-06
  plateau_patience: 3
  plateau_factor: 0.5

# ------------------------------------------------------------------------------
# Epoch & Early Stopping Controls
# ------------------------------------------------------------------------------
training:
  max_epochs: 6
  min_epochs: 3
  early_stopping:
    enabled: true
    patience: 3
    min_delta: 0.0001
  model_selection_metric: "val_f1"  # "val_f1", "val_accuracy", "val_loss"
  checkpoint_interval: 1
  log_every_n_steps: 10

# ------------------------------------------------------------------------------
# Evaluation & Metric Calculation Settings
# FIX: Added balanced_accuracy, weighted_f1, micro_f1 flags
# ------------------------------------------------------------------------------
evaluation:
  compute_auc: true
  compute_mcc: true
  compute_kappa: true
  compute_balanced_accuracy: true  # FIX: added
  compute_weighted_f1: true        # FIX: added
  compute_micro_f1: true           # FIX: added
  save_predictions: true
  formats: ["csv", "json", "excel"]
  save_classification_report_csv: true  # FIX: added
